# CallMQTT detection rules.
#
# Every pattern below was taken from a real capture in testdata/probe/*.txt -
# see the fixture-driven tests in rules_test.go for the exact line each one
# came from. Do not add a pattern here without a fixture backing it; if a
# scenario needs a new pattern, capture it first.
#
# Weights are tuned toward under-triggering: a wrong "active" (red light while
# the user is just chatting, listening to music, or has an app open but idle)
# is worse than a missed call. Process presence alone never crosses the active
# threshold (default 0.70, see config.Detection.ActiveThreshold); the
# microphone alone never does either, because music players and personal
# phone calls also hold it.

rules:
  # Microsoft Teams (the MSIX/"new Teams" client, process ms-teams.exe).
  #
  # Known hazard (see testdata/probe/teams-in-call.txt vs
  # teams-in-call-muted.txt): muting/unmuting does not change the window
  # title at all, and the microphone stays reported as "in use" in both
  # captures. New Teams exposes no distinguishable mute-state signal in the
  # window title, so this rule - and therefore mute/unmute - causes no score
  # change and no state change, by construction rather than by luck.
  #
  # Confirmed false positive (live testing, 2026-09-14): new Teams always
  # keeps a small utility window titled exactly "Meet | Microsoft Teams"
  # open, even when completely idle with no call in progress and 0 apps
  # using the microphone (`go run ./cmd/probe --count 1` showed only
  # pid=63580 proc=ms-teams.exe title="Meet | Microsoft Teams", no
  # "Meeting with ..." window). testdata/probe/teams-open-no-call.txt never
  # exercised this because it happened to be captured on the Chat tab, so
  # the bare "Meet" window slipped past the old broader include regex
  # below and alone crossed the 0.70 active threshold (process 0.20 +
  # window 0.55 = 0.75). The bare "Meet" window is Teams' persistent
  # Meet-now/calendar landing window, not evidence of a call, so it must
  # NOT be in window_include_regex on its own. Only the real meeting
  # title, "Meeting with <name> | Microsoft Teams" (present alongside the
  # bare "Meet" window throughout testdata/probe/teams-in-call.txt), is
  # matched without microphone evidence. A second live capture on 2026-09-15 exposed the meeting as
  # "Weekly Zac | Microsoft Teams", alongside a Chat window and Teams mic
  # and webcam entries (teams-in-call-generic-title.txt). Because that title
  # is not intrinsically call-specific, its window evidence requires the mic
  # signal to cross the active threshold.
  - app: teams
    process_names:
      - ms-teams.exe
    # Captured meeting window (teams-in-call.txt):
    #   title="Meeting with Sharon Rimer | Microsoft Teams"
    # Captured generic meeting window (teams-in-call-generic-title.txt):
    #   title="Weekly Zac | Microsoft Teams"
    # Deliberately excludes the bare "Meet | Microsoft Teams" utility
    # window - see the false-positive note above and the
    # teams-idle-meet-window-only regression test in rules_test.go.
    window_include_regex:
      - '^.+ \| Microsoft Teams$'
    # Captured chat window, mic idle (teams-open-no-call.txt):
    #   title="Chat | Copilot Israel - Live | Microsoft Teams"
    # These known idle titles are explicit per-window vetoes. Other Teams
    # titles contribute window evidence, but still require the microphone to
    # cross the active threshold.
    window_exclude_regex:
      - '^Chat \|.*\| Microsoft Teams$'
      - '^Meet \| Microsoft Teams$'
    # Captured mic-in-use entry during a call (teams-in-call.txt):
    #   MSTeams_8wekyb3d8bbwe
    mic_process_regex:
      - '(?i)^MSTeams'
    weights:
      process: 0.20
      window: 0.40
      mic: 0.25
      # process + window = 0.60, deliberately inactive for a title alone;
      # process + window + mic = 0.85 for a captured live call.
      # 0.60 is above the 0.30 inactive floor, which is safe only because
      # the detector's hold also requires the mic (or webcam) to still be
      # held: the moment Teams releases it, an open Calendar/Activity tab
      # reads inactive rather than pinning the light red (issue #2).
      # The bare "Meet | Microsoft Teams" utility window no longer matches
      # window_include_regex at all, so on its own it scores process-only
      # (0.20), well below the 0.70 active threshold.

  # Zoom (Zoom.exe).
  - app: zoom
    process_names:
      - Zoom.exe
    # Captured only while actually in a meeting (zoom-in-call.txt):
    #   title="Zoom Meeting"
    #   title="ZPToolBarParentWnd"
    # Both windows disappear once the meeting ends (zoom-open-no-call.txt
    # shows neither, only the always-present main window below).
    window_include_regex:
      - '^(Zoom Meeting|ZPToolBarParentWnd)$'
    # Captured with Zoom open all day but never joined (zoom-open-no-call.txt):
    #   title="Zoom Workplace"
    # This is Zoom's always-present main window; it is excluded explicitly so
    # that S3 (Zoom open all day, never joined) can never contribute a window
    # match even if a future Zoom build reuses the string elsewhere.
    window_exclude_regex:
      - '^Zoom Workplace$'
    # Captured mic-in-use entry during a call (zoom-in-call.txt):
    #   C:\Users\Sharon\AppData\Roaming\Zoom\bin\Zoom.exe
    mic_process_regex:
      - '(?i)zoom\.exe$'
    weights:
      process: 0.20
      window: 0.55
      mic: 0.25

  # Slack huddles (Slack.exe).
  #
  # Known gap (see testdata/probe/slack-huddle.txt): the huddle speaker
  # marker only appeared on one capture out of many taken during the same
  # huddle -
  #   title="Sharon Rimer (DM) - SQL Server Community - Slack [Main] \U0001F50A"
  # - versus the far more common
  #   title="Sharon Rimer (DM) - SQL Server Community - Slack [Main] \U0001F3E0"
  # (house icon, no speaker) seen in every other sample of the same huddle.
  # Because the marker is intermittent, window match alone is deliberately
  # kept below the active threshold here (process + window = 0.60): a huddle
  # is only called active once the marker coincides with the microphone
  # being held by Slack, which was true throughout the whole capture. This
  # trades a slower/occasional miss for never firing on the marker alone.
  - app: slack
    process_names:
      - Slack.exe
    window_include_regex:
      - '\x{1F50A}'
    # Captured mic-in-use entry during the huddle (slack-huddle.txt):
    #   com.tinyspeck.slackdesktop_8yrtsj140pw4g
    mic_process_regex:
      - '(?i)^com\.tinyspeck\.slackdesktop'
    weights:
      process: 0.20
      window: 0.40
      mic: 0.25
      # process + window = 0.60 (deliberately inactive on the marker alone);
      # process + window + mic = 0.85 (active).

  # Google Meet, in a browser (chrome.exe, msedge.exe, brave.exe,
  # firefox.exe, vivaldi.exe, opera.exe - including Chrome/Edge "installed
  # app" (PWA) windows, which are still owned by the browser process).
  #
  # Captured live on 2026-09-18 in Chrome (meet-landing-page.txt,
  # meet-lobby.txt, meet-in-call.txt, meet-left.txt; the real meeting code
  # is replaced by abc-defg-hij, nothing else is edited):
  #
  #   landing page   title="Google Meet - Google Chrome"        mic idle
  #   "Ready to      title="Meet - abc-defg-hij - Google Chrome" mic held
  #    join?" lobby
  #   joined call    title="Meet - abc-defg-hij - Google Chrome" mic held
  #                  (briefly "Meet - abc-defg-hij" with no browser suffix)
  #   left the call  title="Meet - abc-defg-hij - Google Chrome" mic idle
  #                  (the tab lingers; Chrome releases the mic ~10 s after
  #                  Leave, meet-left.txt snapshot 15)
  #
  # What this means, and it is the honest limit of OS-level detection: the
  # lobby and the call are indistinguishable. Same title, same mic grant,
  # and (probe [audio-out]) the browser opens an audio output stream as soon
  # as the Meet page loads, so an active render session tells them apart
  # no better than the mic does. So this rule treats "Ready to join?" as the
  # start of the call - the light turns on when you reach the lobby, which
  # in practice is under a minute before you are in. Documented in README.
  #
  # Weights, against the default thresholds (active 0.70, inactive 0.30):
  #
  #   lobby / in call (title + mic)      = 0.75  active
  #   in call, another tab in front      = 0.50  mic alone holds an active
  #     (a browser shows only its active     call (above the floor and the
  #      tab's title)                        device is still held), but can
  #                                          never start one
  #   left the call (title lingers)      = 0.25  inactive: below the floor,
  #                                              so the light goes out on
  #                                              mic release, not tab close
  #   landing page, any browser open     = 0     process is weighted 0 - a
  #                                              browser is always open
  - app: meet
    process_names:
      - chrome.exe
      - msedge.exe
      - brave.exe
      - firefox.exe
      - vivaldi.exe
      - opera.exe
    # Captured (meet-lobby.txt, meet-in-call.txt, meet-left.txt):
    #   title="\u202aMeet - abc-defg-hij - Google Chrome\u202c"
    #   title="\u202aMeet - abc-defg-hij\u202c"
    # The \u202a/\u202c are Unicode bidi controls (\p{Cf}) Chrome wraps
    # titles in on this Hebrew-locale machine. Meet used a plain hyphen
    # here; the en/em dash alternatives and the optional "(1) " tab badge
    # are allowed for other locales and browsers but are not yet captured.
    # The subject after the separator must start with a real character, and
    # the "Google Meet" landing page never matches (it does not start with
    # "Meet ").
    window_include_regex:
      - '^\p{Cf}*(\(\d+\) )?Meet [-\x{2013}\x{2014}] [^\s\-\x{2013}\x{2014}]'
    # Captured transition page while the lobby loads (meet-lobby.txt
    # snapshot 32, mic not yet granted):
    #   title="‪Meet - Google Chrome‬"
    # That is a tab titled just "Meet" plus the browser suffix, so the
    # include regex reads "Google Chrome" as the meeting subject. Vetoed
    # explicitly, per browser, so a bare "Meet" tab never counts.
    window_exclude_regex:
      - '^\p{Cf}*(\(\d+\) )?Meet [-\x{2013}\x{2014}] (Google Chrome|Microsoft Edge|Brave|Mozilla Firefox|Vivaldi|Opera)\p{Cf}*$'
    # Captured mic-in-use entry (meet-lobby.txt, meet-in-call.txt):
    #   C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
    mic_process_regex:
      - '(?i)(^|\\)(chrome|msedge|brave|firefox|vivaldi|opera)\.exe$'
    weights:
      process: 0.0
      window: 0.25
      mic: 0.50
