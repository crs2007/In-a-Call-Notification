# In a Call Notification configuration.
#
# Copy to %APPDATA%\callmqtt\config.yaml (Windows) and edit.
# Check it with:  callmqtt --validate-config

app:
  # "auto" derives the id from this machine's hostname. It appears in the MQTT
  # topics and in the Home Assistant entity id.
  device_id: auto

mqtt:
  host: 192.168.1.10
  port: 1883
  username: callmqtt
  # Prefer an environment variable over a literal secret. In a Call Notification warns if
  # this is written directly into the file.
  password: ${CALLMQTT_MQTT_PASSWORD}
  # tls:
  #   enabled: true
  #   # Trust a self-signed or private-CA broker cert without turning off
  #   # verification. PEM file, relative to this config file's directory.
  #   ca_file: ca.pem
  #   # Only if the broker requires a client certificate. Both must be set
  #   # together, or neither.
  #   cert_file: client.pem
  #   key_file: client-key.pem
  #   # Verification is real security; only for a lab broker you fully trust.
  #   insecure_skip_verify: false
  discovery:
    # Creates the Home Assistant binary_sensor automatically. With this on you
    # never write a line of Home Assistant YAML.
    enabled: true
    prefix: homeassistant

# Presence is published ONLY while connected to one of these networks.
# Matching any single field is enough, so one rule covers both Wi-Fi and
# Ethernet at the same site. An empty list publishes nothing at all.
allowed_networks:
  - name: Home
    cidrs:
      - "192.168.1.0/24"

detectors:
  teams:
    enabled: true
  zoom:
    enabled: true
  slack:
    enabled: true
  # Google Meet in a browser (Chrome, Edge, Brave, Firefox, Vivaldi, Opera).
  # Needs no extension: it reads the browser's window title and whether the
  # browser holds the microphone. Note the light turns on at the "Ready to
  # join?" screen, not at Join - see the README's "Google Meet" section.
  meet:
    enabled: true

# Override the built-in detection rules (process names, window title regexes,
# weights) with your own file, instead of editing the binary's embedded
# rules.yaml. Relative to this config file's directory.
# rules_file: rules.yaml

detection:
  # A signal must reach active_threshold to count as a call. Raise it if you
  # get false positives; a light that lies is worse than one that is late.
  active_threshold: 0.70
  # Once active, a detector is held active while its confidence stays at or
  # above inactive_threshold AND the app still holds the microphone or
  # webcam. Releasing the device ends the hold whatever the confidence, so a
  # client left open after a call never keeps the light on.
  inactive_threshold: 0.30
  # Deliberately asymmetric: quick to light up, slow to go dark, so muting or
  # toggling your camera never makes the light blink mid-call.
  enter_debounce_seconds: 2
  exit_debounce_seconds: 8

poll:
  detect_seconds: 2
  network_seconds: 10
  # State is re-asserted this often. Home Assistant gives up on the entity
  # after 1.5x this, which is what turns the light off if this machine dies.
  heartbeat_seconds: 60

logging:
  level: info
  # Defaults to %APPDATA%\callmqtt\callmqtt.log. Rotated automatically once it
  # passes 5 MB: the old file becomes callmqtt.log.1 (overwriting any previous
  # one), and a fresh file is started. Only one generation of history is kept.
  # file: callmqtt.log
