name: Release

# Every push to main cuts a release: the `version` job computes the next
# semver tag from the latest existing v* tag (patch bump by default, `[minor]`
# or `[major]` in the head commit subject for a bigger jump, `[skip release]`
# to publish nothing), pushes that tag, and the `goreleaser` job builds and
# publishes the assets for it. Pushing a v* tag by hand still works and takes
# the tag as-is (that is how a -alpha.N / -rc.N pre-release is cut).
#
# The tag is pushed with GITHUB_TOKEN, which deliberately does not fire a
# second run of this workflow — the same run carries on to publish.
#
# Flow: verify (Windows) + verify-macos -> version (pushes the tag) ->
# package-macos (macos-latest, builds the .app zip) -> goreleaser (Windows
# zips + the macOS zip, one checksums.txt, one publish).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

# Releases must be serialised: two quick pushes to main would otherwise race
# to compute the same "next" tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The gate runs before the tag is pushed, so a red build never consumes a
  # version number. Skipped for [skip release] commits (nothing will publish).
  verify:
    name: verify (vet, test, tidy, tray builds)
    if: >-
      github.ref_type == 'tag' ||
      !(contains(github.event.head_commit.message, '[skip release]') ||
        contains(github.event.head_commit.message, '[no release]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      # GoReleaser's before-hook runs `go mod tidy`; if that changes anything
      # the publish pass refuses to run on a dirty tree. Fail here with a
      # readable reason instead.
      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build tray (windows/amd64)
        run: go build -tags tray ./...
        env:
          GOOS: windows
          GOARCH: amd64

      - name: build tray (windows/arm64)
        run: go build -tags tray ./...
        env:
          GOOS: windows
          GOARCH: arm64

  # Same gate on macOS (shared with ci.yml), including a packaging dry run, so
  # a red macOS build or a broken .app script never consumes a version either.
  verify-macos:
    name: verify (macOS vet, test, universal .app)
    if: >-
      github.ref_type == 'tag' ||
      !(contains(github.event.head_commit.message, '[skip release]') ||
        contains(github.event.head_commit.message, '[no release]'))
    uses: ./.github/workflows/macos-checks.yml

  version:
    name: compute release tag
    needs: [verify, verify-macos]
    if: >-
      ${{ !cancelled() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.verify-macos.result == 'success' || needs.verify-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine and push the release tag
        id: next
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # versionsort.suffix=- makes v0.1.0-alpha.1 sort *before* v0.1.0,
          # as semver requires; git's default puts suffixed tags after.
          git config versionsort.suffix -

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag push: releasing $GITHUB_REF_NAME as-is"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            # A tag with no release behind it is a previous run that failed
            # after tagging: publish it now instead of skipping.
            if gh release view "$existing" >/dev/null 2>&1; then
              echo "HEAD is already tagged $existing and released"
              echo "tag=" >> "$GITHUB_OUTPUT"
            else
              echo "HEAD is tagged $existing but has no release; publishing it"
              echo "tag=$existing" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Markers are read from the subject line only, so a body that
          # merely *mentions* "[skip release]" does not trigger it.
          message=$(git log -1 --pretty=%s)
          if grep -qiE '\[(skip|no) release\]' <<<"$message"; then
            echo "Commit message asks to skip the release"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump=${BUMP_INPUT:-}
          if [ -z "$bump" ]; then
            bump=patch
            grep -qiE '\[minor\]' <<<"$message" && bump=minor
            grep -qiE '\[major\]' <<<"$message" && bump=major
          fi

          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          core=${latest#v}
          prerelease=""
          if [[ "$core" == *-* ]]; then
            prerelease=${core#*-}
            core=${core%%-*}
          fi
          IFS=. read -r major minor patch <<<"$core"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch)
              # A pre-release (v0.1.0-alpha.1) is promoted to its base
              # version (v0.1.0) rather than skipping past it.
              if [ -z "$prerelease" ]; then
                patch=$((patch + 1))
              fi
              ;;
            *) echo "unknown bump '$bump'" >&2; exit 1 ;;
          esac
          next="v$major.$minor.$patch"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "computed tag $next already exists" >&2
            exit 1
          fi

          echo "latest=$latest bump=$bump next=$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "refs/tags/$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  # Builds the macOS asset (callmqtt_<version>_darwin_universal.zip) BEFORE
  # goreleaser runs and passes it over as an artifact. Why not build it in
  # goreleaser or upload it afterwards:
  #   - the .app needs macOS-only tools (lipo, codesign, ditto, plutil) and
  #     the goreleaser job is on windows-latest;
  #   - goreleaser folds the zip into checksums.txt and the release upload
  #     (checksum.extra_files / release.extra_files), so there is one publish
  #     step, checksums.txt covers every asset, and no already-published
  #     release is ever edited;
  #   - the job hangs off `version`, so a tagged HEAD with no release (the
  #     recovery path) rebuilds the macOS asset the same way as a fresh tag.
  # scripts/package-macos.sh is the same script the macOS CI job dry-runs.
  #
  # Signing is OFF unless the MACOS_SIGN_P12 secret (and the four others
  # listed in the script) exist; then the app is Developer-ID signed and
  # notarized. Without them the app is ad-hoc signed only.
  package-macos:
    name: package macOS app
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build, bundle and zip the universal app
        run: scripts/package-macos.sh "$RELEASE_TAG" "$RUNNER_TEMP/macos-dist"
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: ${{ runner.temp }}/macos-dist/callmqtt_*_darwin_universal.zip
          if-no-files-found: error
          retention-days: 7

  goreleaser:
    name: goreleaser
    needs: [version, package-macos]
    if: needs.version.outputs.tag != ''
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      # Pin GoReleaser to the tag we just computed instead of letting it
      # guess from `git describe`.
      GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The macOS zip from package-macos. goreleaser lists it in checksums.txt
      # and uploads it with the Windows zips (see .goreleaser.yaml). It is
      # untracked, and goreleaser refuses a dirty tree, so exclude it locally.
      - uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: macos-assets

      - name: Keep the macOS asset out of goreleaser's dirty-tree check
        shell: bash
        run: |
          set -euo pipefail
          echo "/macos-assets/" >> .git/info/exclude
          ls -l macos-assets

      - name: Build release artifacts for version preflight
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the amd64 executable reports the release version
        shell: pwsh
        run: |
          $metadataFiles = @(Get-ChildItem -Path dist -Filter metadata.json -Recurse)
          $artifactFiles = @(Get-ChildItem -Path dist -Filter artifacts.json -Recurse)
          if ($metadataFiles.Count -ne 1 -or $artifactFiles.Count -ne 1) {
            throw "Expected one metadata.json and one artifacts.json in dist"
          }

          $metadata = Get-Content -Raw $metadataFiles[0].FullName | ConvertFrom-Json
          $artifacts = Get-Content -Raw $artifactFiles[0].FullName | ConvertFrom-Json
          $releaseTag = $env:RELEASE_TAG
          $tagVersion = $releaseTag -replace '^v', ''
          if ($metadata.tag -ne $releaseTag -or $metadata.version -ne $tagVersion) {
            throw "GoReleaser metadata tag/version '$($metadata.tag)'/'$($metadata.version)' does not match '$releaseTag'/'$tagVersion'"
          }

          $amd64Binaries = @($artifacts | Where-Object {
            $_.type -eq 'Binary' -and
            $_.goos -eq 'windows' -and
            $_.goarch -eq 'amd64'
          })
          if ($amd64Binaries.Count -ne 1) {
            throw "Expected one Windows amd64 binary artifact, found $($amd64Binaries.Count)"
          }

          $binaryPath = (Resolve-Path -LiteralPath $amd64Binaries[0].path).Path
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'callmqtt-version.stdout.txt'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'callmqtt-version.stderr.txt'
          $process = Start-Process -FilePath $binaryPath -ArgumentList '-version' -Wait -PassThru `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $output = (Get-Content -Raw $stdoutPath).Trim()
          if ($process.ExitCode -ne 0) {
            $stderr = (Get-Content -Raw $stderrPath).Trim()
            throw "Version command exited with $($process.ExitCode): $stderr"
          }

          $expected = "In a Call Notification $($metadata.version)"
          if ($output -eq 'In a Call Notification dev' -or $output -ne $expected) {
            throw "Expected '$expected', got '$output'"
          }

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
