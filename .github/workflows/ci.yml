name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # windows-latest is the gate: vet, build with and without the tray tag, and
  # the race-enabled test suite. This is the only platform with real signal
  # code (platform/windows/), so it's where bugs actually live.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: build (headless, no tray tag)
        run: go build ./...

      - name: build (tray tag)
        run: go build -tags tray ./...

      # Includes TestFirstLaunchPackagedGUI, which builds the exe the way
      # goreleaser ships it and launches it with no config, so a first
      # launch that exits with nothing on screen (issue #1) fails CI here.
      - name: go test -race
        run: go test -race ./...

      - name: cross-compile windows/arm64 (build check only)
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: arm64

  # Cheap (~20s) sanity check that the darwin stubs in platform/windows/ and
  # cmd/callmqtt still compile, since there's no macOS runner exercising them.
  cross-compile-darwin:
    name: cross-compile (darwin/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build darwin/arm64 (build check only)
        run: go build ./...
        env:
          GOOS: darwin
          GOARCH: arm64

  # Regression guard for the leaked-broker-password incident (TODO.md 2.2):
  # example.yaml must only ever reference secrets via ${VAR}, never write
  # one in as a literal. No Go toolchain needed, so it's a plain shell job.
  check-example-config:
    name: check example.yaml has no real credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mqtt.password must be an env reference, not a literal
        run: |
          if grep -nE '^\s*password:\s*[^$[:space:]]' internal/config/example.yaml; then
            echo "example.yaml must reference \${VAR}, not a literal password" >&2
            exit 1
          fi

      - name: no leaked broker identifiers
        run: |
          if grep -inE 'mqcommunicator|192\.168\.68\.' internal/config/example.yaml; then
            echo "example.yaml must not reference the rotated broker credentials" >&2
            exit 1
          fi
