# Local MQTT broker for development and integration tests.
#
#   docker compose up -d          start
#   docker compose down           stop
#   scripts/broker.ps1 watch      tail every topic
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: callmqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
